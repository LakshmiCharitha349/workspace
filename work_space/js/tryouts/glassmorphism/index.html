<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Glassmorphism Practice</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
    }

    .glass-card {
      width: 300px;
      padding: 25px;
      border-radius: 15px;
      
      /* Glass effect */
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(50px);
      -webkit-backdrop-filter: blur(10px);

      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);

      color: white;
      text-align: center;
    }

    .glass-card h2 {
      margin-bottom: 10px;
    }

    .glass-card p {
      font-size: 14px;
      opacity: 0.8;
    }

    .glass-card button {
      margin-top: 15px;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.25);
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }

    .glass-card button:hover {
      background: rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body>

  <div class="glass-card">
    <h2>Glass Card</h2>
    <p>This is a simple glassmorphism UI. Try changing blur, colors, and opacity!</p>
    <button>Click Me</button>
  </div>

</body>
</html>
