<html>
<style>
  * {
    margin: 0px;
  }

  .container {
    background-color: aqua;
    display: grid;
    gap: 10px;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);

  }

  .item {
    background-color: aliceblue;
    width: 100px;
    height: 100px;
  }
</style>

<body>
  <div class="container">
    <div class="item" id="i1">item 1</div>
    <div class="item" id="i2">item 2</div>
    <div class="item" id="i3">item 3</div>
    <div class="item" id="i4">item 4</div>
    <div class="item" id="i5">item 5</div>
    <div class="item" id="i6">item 6</div>
    <div class="item" id="i7">item 7</div>
  </div>
</body>

</html>
